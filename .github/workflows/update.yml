name: Update internships

on:
  schedule:
    # Minutes 7 and 37, not 0 and 30. GitHub queues scheduled workflows
    # globally and the top of the hour is the busiest slot on the platform —
    # measured Aug 3-5, only 32 of 144 expected runs actually fired, averaging
    # 138 minutes apart. Off-peak minutes get dropped less often.
    - cron: "7,37 * * * *"  # every 30 min (UTC) — peak-season cadence
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed so the bot can commit the refreshed data
  actions: read               # verify Pages deployed before sending alerts

concurrency:
  group: intern-engine-writer
  cancel-in-progress: false

jobs:
  update:
    # Pinned for REPRODUCIBILITY, not as an outage fix: `ubuntu-latest` already
    # resolves to 24.04 today, so this is the same pool — it just stops the
    # image moving under us when GitHub advances the alias. The 2026-08-06
    # runner-allocation failures (zero steps, blank runner_name, "not acquired
    # by a Runner of type hosted") were a platform incident that no repo-side
    # setting prevents; recovery is handled by retry.yml instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Refresh queued checkout
        run: |
          git fetch --no-tags origin main
          git checkout --detach origin/main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the engine
        env:
          # Optional: WORKDAY_PROXY lets the cloud runner reach Workday tenants
          # that block datacenter IPs. Unset = Workday runs direct.
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          # Optional: set these repo secrets to mirror each run into Postgres.
          # Unset = the engine still runs and exports README/CSV as normal.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run.py update

      # The gate between "we produced output" and "the world sees it". Checks
      # every open role against the accuracy invariants AND the run as a whole
      # (volume floor, fetch collapse). If this fails the job stops here with
      # the previous good build still live on Pages.
      - name: Verify accuracy before publishing
        env:
          MIN_OPEN_ROLES: "70"
          MAX_STATS_AGE_HOURS: "2"
        run: python tools/verify_accuracy.py

      # Alerts are sent by a LATER step, on purpose: an alert promises the role
      # is on the list, so nothing goes out until this push actually lands.
      - name: Commit & push if changed
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/internships.csv data/stats.json \
                  data/health.json data/history.jsonl data/mail_state.json \
                  data/observed.json data/known_windows.json data/outbox.json \
                  docs/index.html docs/feed.xml docs/unsubscribe.html \
                  docs/confirm.html \
                  docs/internships.csv \
                  docs/radar.ics docs/trends-light.svg docs/trends-dark.svg \
                  docs/api/jobs.json docs/api/stats.json docs/api/radar.json
          if git diff --staged --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main changed after generation; refusing to rebase stale artifacts"
            exit 1
          fi
          git push origin HEAD:main
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          # `rendered_at` is the fingerprint the next step waits to see served
          # from the live site: this run wrote it and no other run can have it.
          # `pages_url` mirrors config.pages_base() — owner lowercased, repo as-is.
          {
            echo "pushed=true"
            echo "sha=$(git rev-parse HEAD)"
            echo "rendered_at=$(python -c 'import json; print(json.load(open("data/stats.json"))["rendered_at"])')"
            echo "pages_url=https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"

      # A git push is not yet a public dashboard. During the Aug 6 incident,
      # update #369 pushed successfully while its Pages deploy timed out, so an
      # alert promised a role that was nowhere on the site.
      #
      # This used to look for a Pages WORKFLOW RUN whose head_sha matched the
      # commit, and that premise is false. GitHub attributes the Pages run to
      # whatever sha its build picked up, which is not always the one that
      # triggered it: on 2026-08-07 commit 16b7fe3 pushed at 17:47, Pages built
      # 49 seconds later — and recorded the deployment against the PREVIOUS
      # commit a6cc142. No run ever carried 16b7fe3, so the step polled for its
      # full 12 minutes and failed a run whose deploy had long since succeeded.
      #
      # Ask the question we actually care about instead: is our build live? The
      # published stats carry this run's exact `rendered_at`, so fetching them
      # from the real Pages URL proves the world can see this data — whatever
      # sha GitHub decided to file the deployment under.
      - name: Wait for Pages to serve this build
        id: pages
        if: steps.publish.outputs.pushed == 'true'
        timeout-minutes: 13
        env:
          PAGES_URL: ${{ steps.publish.outputs.pages_url }}
          RENDERED_AT: ${{ steps.publish.outputs.rendered_at }}
        run: |
          set -uo pipefail
          # Bound by the CLOCK, not by an iteration count. Each attempt can take
          # up to curl's 20s timeout plus the sleep, so "72 attempts" could run
          # for 36 minutes and be killed by timeout-minutes — turning the very
          # failure this step was rewritten to stop back into a red run.
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Cache-bust: Pages sits behind a CDN that will happily serve the
            # previous build for a while after the deploy completes.
            live="$(curl -fsSL --max-time 20 \
              "$PAGES_URL/api/stats.json?cb=$(date +%s)" \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("rendered_at",""))' \
              2>/dev/null || true)"
            if [ "$live" = "$RENDERED_AT" ]; then
              echo "Pages is serving this build (rendered_at=$RENDERED_AT)."
              echo "live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          # NOT a failure. The outbox is durable and still holds every alert, so
          # the next run delivers them once the site catches up — which is the
          # designed behaviour, not an incident. Failing here only produced a
          # red run and a failure email for a problem that fixes itself.
          echo "::warning::Pages is still serving an older build after 10 minutes; alerts stay queued for the next run"
          echo "live=false" >> "$GITHUB_OUTPUT"

      - name: Send alerts for what was published
        # Only ever after the data is provably live. A skipped publish (nothing
        # changed) has nothing new to announce but must still run, because the
        # email digest is driven by the store rather than by this run's queue.
        if: steps.publish.outputs.pushed != 'true' || steps.pages.outputs.live == 'true'
        env:
          # Optional: Discord channel webhook — posts each run's new roles.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional: Telegram bot push — instant phone notification per drop.
          # Make a bot with @BotFather, then set both secrets (see telegram.py).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: Brevo transactional key + verified sender — arms the
          # daily email digest to the subscriber list (see mailer.py).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Emails the provider plan allows per rolling day. This is the ONLY
          # dial for how instant alerts are: the cadence is derived from it, so
          # raising it on a bigger plan shortens the gap between digests with
          # no code change. Unset = 300, Brevo's free transactional tier, which
          # a 224-address list can afford exactly once a day.
          MAIL_DAILY_QUOTA: ${{ vars.MAIL_DAILY_QUOTA }}
        run: python run.py notify

      # The alert state the previous step just advanced (which roles have been
      # announced, where the send cursor is) has to persist, or the next run
      # re-announces everything.
      - name: Commit alert state
        run: |
          git add data/mail_state.json data/outbox.json
          if git diff --staged --quiet; then
            echo "No alert state change."
            exit 0
          fi
          ALERT_BASE="$(git rev-parse HEAD)"
          git commit -m "chore: alert state ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          # Pages waiting and provider calls create a legitimate window for an
          # unrelated direct main push. Rebase this ledger-only commit when â€”
          # and only when â€” the remote ledgers themselves are unchanged. That
          # preserves successful delivery settlement instead of replaying it
          # next run, without ever overwriting another notifier's state.
          for _attempt in 1 2 3; do
            git fetch --no-tags origin main
            REMOTE="$(git rev-parse origin/main)"
            if ! git diff --quiet "$ALERT_BASE" "$REMOTE" -- \
                    data/mail_state.json data/outbox.json; then
              echo "::error::alert ledgers changed remotely; refusing an unsafe merge"
              exit 1
            fi
            PARENT="$(git rev-parse HEAD^)"
            if [ "$PARENT" != "$REMOTE" ]; then
              git rebase --onto "$REMOTE" "$PARENT"
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::main advanced during ledger push; retrying safely"
          done
          echo "::error::could not persist alert state after three safe retries"
          exit 1

      # The step that would have caught the 2026-08-24 outage on day one.
      # Supabase auto-paused the free project, every subsequent run's subscriber
      # lookup threw into a bare `except`, and the list heard nothing for 24
      # days while every run stayed green. Nothing here watched delivery.
      #
      # Deliberately AFTER the ledger commit above: this step's whole job is to
      # turn the job red so GitHub emails a human, and doing that before the
      # commit would sacrifice the delivery state to raise the alarm.
      # `always()` so a skipped notify (Pages still catching up) is still
      # checked — the 26-hour threshold means a transient delay never fires it.
      - name: Check the digest is actually going out
        if: always()
        run: python run.py mailcheck
